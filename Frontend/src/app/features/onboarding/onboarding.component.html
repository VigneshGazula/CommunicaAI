<div class="onboarding-page">
  <div class="onboarding-card">
    <div class="onboarding-header">
      <h1 class="brand">Communica<span>AI</span></h1>
      <h2>Upload your media</h2>
      <p>Provide an audio and video file to get started.</p>
    </div>

    <form (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="audioFile">Audio file</label>
        <input
          id="audioFile"
          type="file"
          accept="audio/*"
          (change)="onAudioChange($event)"
        />
        @if (!audioFile && error()) {
          <span class="field-error">Audio file is required.</span>
        }
      </div>

      <div class="field">
        <label for="videoFile">Video file</label>
        <input
          id="videoFile"
          type="file"
          accept="video/*"
          (change)="onVideoChange($event)"
        />
        @if (!videoFile && error()) {
          <span class="field-error">Video file is required.</span>
        }
      </div>

      @if (error()) {
        <div class="alert alert-error">{{ error() }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) { Uploading… } @else { Continue to dashboard }
      </button>
    </form>
  </div>
</div>
